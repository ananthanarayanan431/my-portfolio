<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" role="img" aria-label="Three kinds of self-knowledge feed a check-and-adjust loop" font-size="13"><defs><marker id="meta-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--text-muted)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--text)">Three kinds of self-knowledge feed a check-and-adjust loop</text><g><rect x="24" y="60" width="330" height="264" rx="8" fill="none" stroke="var(--text-muted)" stroke-width="1"></rect><text x="40" y="82" font-weight="600" fill="var(--text)">Self-knowledge</text></g><g><rect x="40" y="92" width="298" height="56" rx="8" fill="none" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="52" y="116" font-weight="600" fill="var(--text)">1. Declarative</text><text x="52" y="132" font-size="11.5" fill="var(--text-muted)">What it knows about its own abilities</text></g><g><rect x="40" y="172" width="298" height="56" rx="8" fill="none" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="52" y="196" font-weight="600" fill="var(--text)">2. Procedural</text><text x="52" y="212" font-size="11.5" fill="var(--text-muted)">How it carries out its methods</text></g><g><rect x="40" y="252" width="298" height="56" rx="8" fill="none" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="52" y="276" font-weight="600" fill="var(--text)">3. Conditional</text><text x="52" y="292" font-size="11.5" fill="var(--text-muted)">When and why to use each method</text></g><g><rect x="386" y="60" width="350" height="264" rx="8" fill="var(--bg-subtle)" stroke="var(--text-muted)" stroke-width="1"></rect><text x="402" y="82" font-weight="600" fill="var(--text)">Self-check loop</text></g><g><rect x="402" y="92" width="318" height="72" rx="8" fill="none" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="414" y="116" font-weight="600" fill="var(--text)">4. Evaluate and assess (Monitor)</text><text x="414" y="132" font-size="11.5" fill="var(--text-muted)">Judges progress and how sure it is:</text><text x="414" y="148" font-size="11.5" fill="var(--text-muted)">its feeling of knowing</text></g><g><rect x="402" y="236" width="318" height="72" rx="8" fill="none" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="414" y="260" font-weight="600" fill="var(--text)">5. Plan and regulate (Control)</text><text x="414" y="276" font-size="11.5" fill="var(--text-muted)">Sets goals and picks a strategy,</text><text x="414" y="292" font-size="11.5" fill="var(--text-muted)">decides how much effort to spend</text></g><g fill="none" stroke="var(--text-muted)" stroke-width="1.25"><path d="M354 192H384" marker-end="url(#meta-arrow)"></path><path d="M480 164V234" marker-end="url(#meta-arrow)"></path><path d="M640 236V166" marker-end="url(#meta-arrow)"></path></g><text x="370" y="182" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">feeds</text><text x="488" y="204" font-size="11.5" fill="var(--text-muted)">estimate</text><text x="648" y="204" font-size="11.5" fill="var(--text-muted)">result</text></svg>
