<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 528" role="img" aria-label="Actions are embedded once and cached; only the state is re-encoded each step" font-size="13"><defs><marker id="clm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--text-muted)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--text)">Actions are embedded once and cached; only the state is re-encoded each step</text><g fill="none" stroke="var(--text-muted)" stroke-width="1.25"><path d="M200 120V160" marker-end="url(#clm-arrow)"></path><path d="M200 216V256" marker-end="url(#clm-arrow)"></path><path d="M200 312V352" marker-end="url(#clm-arrow)"></path><path d="M560 120V160" marker-end="url(#clm-arrow)"></path><path d="M560 216V256" marker-end="url(#clm-arrow)"></path><path d="M560 312V352" marker-end="url(#clm-arrow)"></path><path d="M200 408V428H300V448" marker-end="url(#clm-arrow)"></path><path d="M560 408V428H460V448" marker-end="url(#clm-arrow)"></path></g><g><rect x="70" y="64" width="260" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="200" y="88" text-anchor="middle" font-weight="600" fill="var(--text)">State</text><text x="200" y="104" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">agent context + the question</text></g><g><rect x="430" y="64" width="260" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="560" y="88" text-anchor="middle" font-weight="600" fill="var(--text)">Candidate actions</text><text x="560" y="104" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">supplied by the application</text></g><g><rect x="70" y="160" width="260" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="200" y="184" text-anchor="middle" font-weight="600" fill="var(--text)">Frozen Qwen3-8B</text><text x="200" y="200" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">reads the text; never changed</text></g><g><rect x="430" y="160" width="260" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="560" y="184" text-anchor="middle" font-weight="600" fill="var(--text)">Frozen Qwen3-8B</text><text x="560" y="200" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">reads the text; never changed</text></g><g><rect x="70" y="256" width="260" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="200" y="280" text-anchor="middle" font-weight="600" fill="var(--text)">State head</text><text x="200" y="296" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">small layer, the only trained part</text></g><g><rect x="430" y="256" width="260" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="560" y="280" text-anchor="middle" font-weight="600" fill="var(--text)">Action head</text><text x="560" y="296" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">small layer, the only trained part</text></g><g><rect x="70" y="352" width="260" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="200" y="376" text-anchor="middle" font-weight="600" fill="var(--text)">State vector</text><text x="200" y="392" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">recomputed at every step</text></g><g><rect x="430" y="352" width="260" height="56" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"></rect><text x="560" y="376" text-anchor="middle" font-weight="600" fill="var(--text)">Action vectors</text><text x="560" y="392" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">computed once, then cached</text></g><g><rect x="210" y="448" width="340" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="380" y="472" text-anchor="middle" font-weight="600" fill="var(--text)">Cosine similarity, then softmax</text><text x="380" y="488" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">one probability per candidate; the highest wins</text></g></svg>
