<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" role="img" aria-label="An LLM writes its answer token by token; a CLM scores a list of options" font-size="13"><defs><marker id="cvc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--text-muted)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--text)">An LLM writes its answer token by token; a CLM scores a list of options</text><text x="200" y="68" text-anchor="middle" font-weight="600" fill="var(--text-muted)">Causal language model (LLM)</text><text x="560" y="68" text-anchor="middle" font-weight="600" fill="var(--text-muted)">Contrastive language model (CLM)</text><g fill="none" stroke="var(--text-muted)" stroke-width="1.25"><path d="M200 140V172" marker-end="url(#cvc-arrow)"></path><path d="M200 228V260" marker-end="url(#cvc-arrow)"></path><path d="M200 316V348" marker-end="url(#cvc-arrow)"></path><path d="M340 288H364V200H340" marker-end="url(#cvc-arrow)"></path><path d="M560 140V172" marker-end="url(#cvc-arrow)"></path><path d="M560 228V260" marker-end="url(#cvc-arrow)"></path><path d="M560 316V348" marker-end="url(#cvc-arrow)"></path></g><g><rect x="60" y="84" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="200" y="108" text-anchor="middle" font-weight="600" fill="var(--text)">Prompt</text><text x="200" y="124" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">&quot;Which tool should I call?&quot;</text></g><g><rect x="60" y="172" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="200" y="196" text-anchor="middle" font-weight="600" fill="var(--text)">Predict the next token</text><text x="200" y="212" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">one small piece of a word</text></g><g><rect x="60" y="260" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="200" y="284" text-anchor="middle" font-weight="600" fill="var(--text)">Add it to the text</text><text x="200" y="300" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">then read everything again</text></g><g><rect x="60" y="348" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="200" y="372" text-anchor="middle" font-weight="600" fill="var(--text)">Written answer</text><text x="200" y="388" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">free text your code must parse</text></g><text x="370" y="244" font-size="11.5" fill="var(--text-muted)">repeat</text><text x="208" y="338" font-size="11.5" fill="var(--text-muted)">stops at an end token</text><g><rect x="420" y="84" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="560" y="108" text-anchor="middle" font-weight="600" fill="var(--text)">State + list of options</text><text x="560" y="124" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">context; options: search, calc, email</text></g><g><rect x="420" y="172" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="560" y="196" text-anchor="middle" font-weight="600" fill="var(--text)">Encode state and options</text><text x="560" y="212" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">turn each into a list of numbers</text></g><g><rect x="420" y="260" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="560" y="284" text-anchor="middle" font-weight="600" fill="var(--text)">Score every option</text><text x="560" y="300" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">how closely it matches the state</text></g><g><rect x="420" y="348" width="280" height="56" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"></rect><text x="560" y="372" text-anchor="middle" font-weight="600" fill="var(--text)">Pick the highest score</text><text x="560" y="388" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">a probability per option, no text</text></g></svg>
