<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Where each model spends its work on one decision" font-size="13"><defs><marker id="three-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--text-muted)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--text)">Where each model spends its work on one decision</text><text x="144" y="68" text-anchor="middle" font-weight="600" fill="var(--text-muted)">LLM (causal)</text><text x="380" y="68" text-anchor="middle" font-weight="600" fill="var(--text-muted)">Jev (TypeSafe)</text><text x="616" y="68" text-anchor="middle" font-weight="600" fill="var(--text-muted)">CLM (contrastive)</text><g fill="none" stroke="var(--text-muted)" stroke-width="1.25"><path d="M144 140V172" marker-end="url(#three-arrow)"></path><path d="M144 228V260" marker-end="url(#three-arrow)"></path><path d="M380 140V172" marker-end="url(#three-arrow)"></path><path d="M380 228V260" marker-end="url(#three-arrow)"></path><path d="M616 140V172" marker-end="url(#three-arrow)"></path><path d="M616 228V260" marker-end="url(#three-arrow)"></path></g><g><rect x="36" y="84" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="144" y="108" text-anchor="middle" font-weight="600" fill="var(--text)">Read state and options</text><text x="144" y="124" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">together, on every call</text></g><g><rect x="36" y="172" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="144" y="196" text-anchor="middle" font-weight="600" fill="var(--text)">Write the answer</text><text x="144" y="212" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">token by token</text></g><g><rect x="36" y="260" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="144" y="284" text-anchor="middle" font-weight="600" fill="var(--text)">Parse the text</text><text x="144" y="300" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">check it is a valid option</text></g><g><rect x="272" y="84" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="380" y="108" text-anchor="middle" font-weight="600" fill="var(--text)">Read state and options</text><text x="380" y="124" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">together; state can be reused</text></g><g><rect x="272" y="172" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="380" y="196" text-anchor="middle" font-weight="600" fill="var(--text)">Answer every question</text><text x="380" y="212" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">in one pass, no text</text></g><g><rect x="272" y="260" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="380" y="284" text-anchor="middle" font-weight="600" fill="var(--text)">Typed answers</text><text x="380" y="300" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">trained to be calibrated</text></g><g><rect x="508" y="84" width="216" height="56" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"></rect><text x="616" y="108" text-anchor="middle" font-weight="600" fill="var(--text)">Encode the two apart</text><text x="616" y="124" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">options cached ahead of time</text></g><g><rect x="508" y="172" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="616" y="196" text-anchor="middle" font-weight="600" fill="var(--text)">Compare state to options</text><text x="616" y="212" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">one quick comparison each</text></g><g><rect x="508" y="260" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="616" y="284" text-anchor="middle" font-weight="600" fill="var(--text)">Probability per option</text><text x="616" y="300" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">relative to this list only</text></g></svg>
