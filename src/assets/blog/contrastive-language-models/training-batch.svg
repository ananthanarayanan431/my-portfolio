cent)" stroke-width="2"></rect><rect x="568" y="168" width="136" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="348" y="200" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">push apart</text><text x="492" y="200" text-anchor="middle" font-weight="600" fill="var(--text)">pull closer</text><text x="636" y="200" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">push apart</text></g><g><rect x="280" y="232" width="136" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><rect x="424" y="232" width="136" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--text-muted)" stroke-width="1.25"></rect><rect x="568" y="232" width="136" height="56" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"></rect><text x="348" y="264" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">push apart</text><text x="492" y="264" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">push apart</text><text x="636" y="264" text-anchor="middle" font-weight="600" fill="var(--text)">pull closer</text></g><text x="24" y="320" font-size="11.5" fill="var(--text-muted)">3 matched pairs give 3 correct pairings and 6 wrong ones, with no extra labelling.</text></svg>
