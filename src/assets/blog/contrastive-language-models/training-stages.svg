<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 192" role="img" aria-label="Each training stage asks for a finer match than the one before" font-size="13"><defs><marker id="stage-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--text-muted)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--text)">Each training stage asks for a finer match than the one before</text><g fill="none" stroke="var(--text-muted)" stroke-width="1.25"><path d="M244 116H276" marker-end="url(#stage-arrow)"></path><path d="M484 116H516" marker-end="url(#stage-arrow)"></path></g><g><rect x="36" y="64" width="208" height="104" rx="8" fill="none" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="140" y="88" text-anchor="middle" font-weight="600" fill="var(--text)">1. Pre-training</text><text x="140" y="108" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">everyday questions + answers</text><text x="140" y="124" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">question = state</text><text x="140" y="140" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">answer = action</text><text x="140" y="158" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--text)">Learns general meaning</text></g><g><rect x="276" y="64" width="208" height="104" rx="8" fill="none" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="380" y="88" text-anchor="middle" font-weight="600" fill="var(--text)">2. Mid-training</text><text x="380" y="108" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">tricky wrong answers</text><text x="380" y="124" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">that look almost right</text><text x="380" y="140" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">mixed in with the right ones</text><text x="380" y="158" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--text)">Learns fine distinctions</text></g><g><rect x="516" y="64" width="208" height="104" rx="8" fill="none" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="620" y="88" text-anchor="middle" font-weight="600" fill="var(--text)">3. Post-training</text><text x="620" y="108" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">steps from real agent runs</text><text x="620" y="124" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">each step = state + action</text><text x="620" y="140" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">earlier data kept in the mix</text><text x="620" y="158" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--text)">Learns to pick actions</text></g></svg>
