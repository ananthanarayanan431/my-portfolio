<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" role="img" aria-label="Three questions decide whether a CLM fits the job" font-size="13"><defs><marker id="dec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--text-muted)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--text)">Three questions decide whether a CLM fits the job</text><g fill="none" stroke="var(--text-muted)" stroke-width="1.25"><path d="M340 88H460" marker-end="url(#dec-arrow)"></path><path d="M340 184H460" marker-end="url(#dec-arrow)"></path><path d="M340 280H460" marker-end="url(#dec-arrow)"></path><path d="M190 112V160" marker-end="url(#dec-arrow)"></path><path d="M190 208V256" marker-end="url(#dec-arrow)"></path><path d="M190 304V352" marker-end="url(#dec-arrow)"></path></g><g><rect x="40" y="64" width="300" height="48" rx="8" fill="var(--bg-subtle)" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="190" y="92" text-anchor="middle" font-weight="600" fill="var(--text)">Are the options known in advance?</text></g><g><rect x="40" y="160" width="300" height="48" rx="8" fill="var(--bg-subtle)" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="190" y="188" text-anchor="middle" font-weight="600" fill="var(--text)">Are they reused across many calls?</text></g><g><rect x="40" y="256" width="300" height="48" rx="8" fill="var(--bg-subtle)" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="190" y="284" text-anchor="middle" font-weight="600" fill="var(--text)">Must it be able to say &quot;not sure&quot;?</text></g><text x="400" y="80" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">no</text><text x="400" y="176" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">no</text><text x="400" y="272" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">yes</text><text x="198" y="140" font-size="11.5" fill="var(--text-muted)">yes</text><text x="198" y="236" font-size="11.5" fill="var(--text-muted)">yes</text><text x="198" y="332" font-size="11.5" fill="var(--text-muted)">no</text><g><rect x="460" y="60" width="260" height="56" rx="8" fill="none" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="590" y="84" text-anchor="middle" font-weight="600" fill="var(--text)">Use an LLM</text><text x="590" y="100" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">it can write open-ended answers</text></g><g><rect x="460" y="156" width="260" height="56" rx="8" fill="none" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="590" y="180" text-anchor="middle" font-weight="600" fill="var(--text)">Little speed gain</text><text x="590" y="196" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">caching saves little; LLM or Jev</text></g><g><rect x="460" y="252" width="260" height="56" rx="8" fill="none" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="590" y="276" text-anchor="middle" font-weight="600" fill="var(--text)">Consider Jev</text><text x="590" y="292" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">trained for reliable probabilities</text></g><g><rect x="40" y="352" width="300" height="56" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"></rect><text x="190" y="376" text-anchor="middle" font-weight="600" fill="var(--text)">Use a CLM</text><text x="190" y="392" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">fast choices from a fixed list</text></g></svg>
