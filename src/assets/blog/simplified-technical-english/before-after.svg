<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="The same instruction written in normal English and in Simplified Technical English" font-size="13"><defs><marker id="ste-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--text-muted)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--text)">Same instruction, two ways to write it</text><g><rect x="24" y="56" width="340" height="236" rx="8" fill="none" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="40" y="82" font-weight="600" fill="var(--text)">Normal English (30 words)</text><text x="40" y="112" font-size="12.5" fill="var(--text)">Prior to commencing the deployment, it is</text><text x="40" y="132" font-size="12.5" fill="var(--text)">advisable that the configuration file be</text><text x="40" y="152" font-size="12.5" fill="var(--text)">reviewed in order to ensure that no</text><text x="40" y="172" font-size="12.5" fill="var(--text)">discrepancies are present, following which</text><text x="40" y="192" font-size="12.5" fill="var(--text)">the process may be initiated.</text><text x="40" y="228" font-size="11.5" fill="var(--text-muted)">• passive voice: who reviews it?</text><text x="40" y="246" font-size="11.5" fill="var(--text-muted)">• "advisable", "may": is this optional?</text><text x="40" y="264" font-size="11.5" fill="var(--text-muted)">• three steps hidden in one sentence</text></g><path d="M372 174H410" stroke="var(--text-muted)" stroke-width="1.5" fill="none" marker-end="url(#ste-arrow)"></path><g><rect x="418" y="56" width="318" height="236" rx="8" fill="var(--bg-subtle)" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="434" y="82" font-weight="600" fill="var(--text)">Simplified Technical English (14 words)</text><text x="434" y="116" font-size="12.5" fill="var(--text)">1. Read the configuration file.</text><text x="434" y="140" font-size="12.5" fill="var(--text)">2. Make sure that it has no errors.</text><text x="434" y="164" font-size="12.5" fill="var(--text)">3. Start the deployment.</text><text x="434" y="228" font-size="11.5" fill="var(--text-muted)">• active voice, one action per sentence</text><text x="434" y="246" font-size="11.5" fill="var(--text-muted)">• "must" or "do not", never "advisable"</text><text x="434" y="264" font-size="11.5" fill="var(--text-muted)">• each step can be checked off</text></g><text x="24" y="316" font-size="11.5" fill="var(--text-muted)">Illustrative example written for this post, not taken from the standard.</text></svg>
