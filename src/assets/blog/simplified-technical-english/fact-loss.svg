<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Share of code-specific facts lost: 8.5 percent with a loose instruction, 46.8 percent with the full ASD-STE100 instruction" font-size="13"><text x="24" y="34" font-size="15" font-weight="600" fill="var(--text)">Code-specific facts lost in Claude's explanations</text><text x="24" y="54" font-size="11.5" fill="var(--text-muted)">Lucian Ghinda, Aug 2026. Four code samples, so a small test. Bar scale: 0 to 100%.</text><text x="24" y="100" fill="var(--text)">"Simple Technical English" (loose)</text><rect x="24" y="110" width="680" height="30" rx="4" fill="var(--bg-subtle)"></rect><rect x="24" y="110" width="57.8" height="30" rx="4" fill="var(--text-muted)"></rect><text x="92" y="130" font-weight="600" fill="var(--text)">8.5%</text><text x="24" y="188" fill="var(--text)">Full "ASD-STE100" instruction</text><rect x="24" y="198" width="680" height="30" rx="4" fill="var(--bg-subtle)"></rect><rect x="24" y="198" width="318.2" height="30" rx="4" fill="var(--text-muted)"></rect><text x="354" y="218" font-weight="600" fill="var(--text)">46.8%</text><text x="24" y="256" font-size="11.5" fill="var(--text-muted)">Shorter sentences came with a cost: the strict version threw away content a reader needed.</text></svg>
