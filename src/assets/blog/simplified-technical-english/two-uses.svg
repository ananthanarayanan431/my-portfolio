<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Two uses of STE: output for humans and instructions for agents" font-size="13"><defs><marker id="use-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--text-muted)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--text)">Two different jobs for the same standard</text><g><rect x="24" y="56" width="340" height="212" rx="8" fill="none" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="40" y="82" font-weight="600" fill="var(--text)">A. Output style (Karpathy's use)</text><rect x="44" y="104" width="86" height="40" rx="6" fill="none" stroke="var(--text-muted)"></rect><text x="87" y="129" text-anchor="middle" fill="var(--text)">Model</text><rect x="258" y="104" width="86" height="40" rx="6" fill="none" stroke="var(--text-muted)"></rect><text x="301" y="129" text-anchor="middle" fill="var(--text)">You</text><path d="M134 124H254" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#use-arrow)"></path><text x="194" y="116" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">explains in STE</text><text x="40" y="180" font-size="12" fill="var(--text)">Reader: a person who must check the answer.</text><text x="40" y="202" font-size="11.5" fill="var(--text-muted)">Goal: easier to read and to verify.</text><text x="40" y="222" font-size="11.5" fill="var(--text-muted)">Best for: explanations, status reports.</text><text x="40" y="242" font-size="11.5" fill="var(--text-muted)">Risk: facts get dropped.</text></g><g><rect x="396" y="56" width="340" height="212" rx="8" fill="var(--bg-subtle)" stroke="var(--text-muted)" stroke-width="1.25"></rect><text x="412" y="82" font-weight="600" fill="var(--text)">B. Agent-facing text</text><rect x="416" y="104" width="86" height="40" rx="6" fill="none" stroke="var(--text-muted)"></rect><text x="459" y="129" text-anchor="middle" fill="var(--text)">You</text><rect x="630" y="104" width="86" height="40" rx="6" fill="none" stroke="var(--text-muted)"></rect><text x="673" y="129" text-anchor="middle" fill="var(--text)">Agent</text><path d="M506 124H626" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#use-arrow)"></path><text x="566" y="116" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">prompts, tool docs</text><text x="412" y="180" font-size="12" fill="var(--text)">Reader: an agent that cannot ask questions.</text><text x="412" y="202" font-size="11.5" fill="var(--text-muted)">Goal: no way to misread an instruction.</text><text x="412" y="222" font-size="11.5" fill="var(--text-muted)">Best for: system prompts, error messages.</text><text x="412" y="242" font-size="11.5" fill="var(--text-muted)">Risk: false sense of "compliance".</text></g></svg>
